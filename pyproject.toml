[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pinn-ebv-tumor"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.26", "pandas>=2.2", "PyYAML>=6.0", "scipy>=1.12"]

[project.scripts]
pinn-ebv-train = "pinn_ebv_tumor.cli:train_main"
pinn-ebv-evaluate = "pinn_ebv_tumor.cli:evaluate_main"
pinn-ebv-infer = "pinn_ebv_tumor.cli:infer_main"

[tool.setuptools.packages.find]
where = ["code"]

[tool.pytest.ini_options]
pythonpath = ["code"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
packages = ["pinn_ebv_tumor"]
mypy_path = "code"
